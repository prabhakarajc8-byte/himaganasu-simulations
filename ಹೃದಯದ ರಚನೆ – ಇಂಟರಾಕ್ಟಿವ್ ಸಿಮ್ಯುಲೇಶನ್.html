<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ಹೃದಯದ ರಚನೆ – ಇಂಟರಾಕ್ಟಿವ್ ಸಿಮ್ಯುಲೇಶನ್</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫀</text></svg>">
<style>
:root{--bg:#f3f7fb;--card:#fff;--ink:#1c2f44;--mut:#52677c;--line:#d6e2ec;--acc:#a3223f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a26;--card:#192a3b;--ink:#e8f0f7;--mut:#a7bbcc;--line:#2d4357;--acc:#ff8097;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--ink);font-family:"Noto Sans Kannada","Nirmala UI",system-ui,sans-serif}
h1{text-align:center;font-size:clamp(1.2rem,2.8vw,1.7rem);margin:4px 0 10px}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;align-items:center;margin-bottom:10px}
.ctl button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:5px 13px}
.ctl button.cur{border-color:var(--acc);color:var(--acc);font-weight:600}
.ctl label{display:flex;gap:7px;align-items:center;color:var(--mut);font-size:.9rem}
button:focus-visible,input:focus-visible,.h:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;max-width:1150px;margin:auto}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.wrap{position:relative;border-radius:10px;overflow:hidden;background:#fff;max-width:620px;margin:auto}
.wrap img,.wrap svg{display:block;width:100%;height:auto}
.wrap svg{position:absolute;inset:0}
.h{fill:transparent;stroke:transparent;stroke-width:2;cursor:pointer;transition:fill .15s,stroke .15s}
.h:hover,.h.on{fill:rgba(255,200,40,.28);stroke:#ffb703}
.show .h{stroke:rgba(255,160,0,.8);stroke-dasharray:4 3}
.col{display:flex;flex-direction:column;gap:12px}
#ph{font-size:1.1rem;font-weight:700;color:var(--acc);margin-bottom:2px}
#pd{font-size:.9rem;color:var(--mut);margin-bottom:8px;line-height:1.6}
#st{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.88rem;color:var(--mut)}
#st b{color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
#info{border-left:6px solid var(--acc);min-height:110px}
#info h3{margin:0 0 4px;font-size:1.02rem}#info p{margin:0;color:var(--mut);line-height:1.7}
.leg{font-size:.85rem;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:2px solid #fff;outline:1px solid #888}
#ecg line{stroke:#ffb703}
</style>
</head>

const snd=E(ec,'text',{x:300,y:68,'text-anchor':'middle',style:'font-size:13px;font-weight:700;fill:var(--acc)'});
/* state */
const names={tri:'ತ್ರಿಕವಾಟ',mit:'ದ್ವಿಕವಾಟ',aov:'ಮಹಾಧಮನಿ ಕವಾಟ',pulv:'ಫೆಪ್ಪಣ ಕವಾಟ'};
$('#st').innerHTML='<div id="s1"></div><div id="s2"></div><div id="s3"></div><div id="s4"></div>';
const PH=[['ಅಲಿಂದ ಸಂಕೋಚನ','ಎರಡೂ ಅಲಿಂದಗಳು ಸಂಕುಚಿತಗೊಂಡು ರಕ್ತವನ್ನು ನಿಲಯಗಳಿಗೆ ತಳ್ಳುತ್ತವೆ. ತ್ರಿಕವಾಟ ಮತ್ತು ದ್ವಿಕವಾಟ ತೆರೆದಿರುತ್ತವೆ.'],['ನಿಲಯ ಸಂಕೋಚನ','ನಿಲಯಗಳು ಸಂಕುಚಿತಗೊಂಡು ರಕ್ತವನ್ನು ಫೆಪ್ಪಣ ಧಮನಿ ಮತ್ತು ಮಹಾಧಮನಿಗೆ ಪಂಪ್ ಮಾಡುತ್ತವೆ. ಇದೇ ಸಮಯದಲ್ಲಿ "ಲಬ್" ಶಬ್ದ.'],['ವಿಶ್ರಾಂತಿ','ಹೃದಯ ವಿಶ್ರಾಂತಿಯಲ್ಲಿದ್ದು ಅಲಿಂದಗಳು ಶಿರೆಗಳಿಂದ ರಕ್ತ ತುಂಬಿಕೊಳ್ಳುತ್ತವೆ. "ಡಬ್" ಶಬ್ದ ಮೊದಲಿಗೆ ಬರುತ್ತದೆ.']];
let t=0,playing=true,last=performance.now(),bpm=72,slow=.5;
function render(p){
 const a=p<.12?Math.sin(p/.12*Math.PI):0,v=p<.12?0:p<.22?ease((p-.12)/.1):p<.4?1:1-ease((p-.4)/.15);
 for(const k in GL){const g=GL[k],s=g[4]=='a'?a:v,c=g[5];c.setAttribute('opacity',.45*s);const sc=1-.12*s;c.setAttribute('transform',`translate(${g[0]} ${g[1]}) scale(${sc}) translate(${-g[0]} ${-g[1]})`)}
 const tg={tri:AVW(p),mit:AVW(p),aov:SLW(p),pulv:SLW(p)};
 for(const k in tg){op[k]+=((tg[k]?1:0)-op[k])*.25;const o=op[k],V=VL[k];V[3].setAttribute('stroke',o>.5?'#2e9d5b':'#e33');V[3].setAttribute('transform',`rotate(${(V[2]=='av'?70:-70)*o} ${V[0]} ${V[1]})`)}
 const i=p<.12?0:p<.42?1:2;$('#ph').textContent=PH[i][0];$('#pd').textContent=PH[i][1];
 [['tri','s1'],['mit','s2'],['aov','s3'],['pulv','s4']].forEach(([k,id])=>{const o=tg[k];$('#'+id).innerHTML=`<span class="dot" style="background:${o?'#2e9d5b':'#e33'}"></span>${names[k]}: <b>${o?'ತೆರೆದಿದೆ':'ಮುಚ್ಚಿದೆ'}</b>`});
 const x=10+p*580;cur.setAttribute('x1',x);cur.setAttribute('x2',x);
 snd.textContent=(p>=.12&&p<.2)?'ಲಬ್':(p>=.42&&p<.5)?'ಡಬ್':'';
 document.querySelectorAll('#pb button').forEach((b,j)=>b.classList.toggle('cur',j==i))}
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;const d=dt*bpm/60*slow;if(playing)t=(t+d)%1;
 for(const f of FL){const on=playing&&(!f.win||f.win(t));if(on)f.pr+=d*f.sp*2.2;f.o+=((f.win?(on?1:.12):1)-f.o)*.2;
  f.dots.forEach((c,i)=>{const q=f.p.getPointAtLength(((f.pr+i/f.N)%1)*f.L);c.setAttribute('cx',q.x);c.setAttribute('cy',q.y);c.setAttribute('opacity',f.o)})}
 render(t);requestAnimationFrame(frame)}
/* controls */
const pb=$('#pb');[['ಅಲಿಂದ ಸಂಕೋಚನ',.06],['ನಿಲಯ ಸಂಕೋಚನ',.28],['ವಿಶ್ರಾಂತಿ',.7]].forEach(([n,v])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{t=v;playing=false;$('#pp').textContent='▶ ಮುಂದುವರಿಸಿ'};pb.append(b)});
$('#pp').onclick=()=>{playing=!playing;$('#pp').textContent=playing?'⏸ ನಿಲ್ಲಿಸಿ':'▶ ಮುಂದುವರಿಸಿ'};
$('#bpm').oninput=e=>{bpm=+e.target.value;$('#bv').textContent=bpm};
$('#slow').oninput=e=>{slow=+e.target.value;$('#sv').textContent=slow+'×'};
$('#sh').onclick=()=>{const s=$('#wrap').classList.toggle('show');$('#sh').setAttribute('aria-pressed',s)};
/* info */
const I={
aorta:['ಮಹಾಧಮನಿ (Aorta)','ದೇಹದ ಅತಿ ದೊಡ್ಡ ಧಮನಿ. ವಾಮ ನಿಲಯದಿಂದ ಆಮ್ಲಜನಕಯುಕ್ತ ರಕ್ತವನ್ನು ಇಡೀ ದೇಹಕ್ಕೆ ಒಯ್ಯುತ್ತದೆ.'],
pa:['ಫೆಪ್ಪಣ ಧಮನಿ (Pulmonary artery)','ದಕ್ಷಿಣ ನಿಲಯದಿಂದ ಆಮ್ಲಜನಕ ಕಡಿಮೆ ರಕ್ತವನ್ನು ಫೆಪ್ಪಸಗಳಿಗೆ (ಶ್ವಾಸಕೋಶ) ಒಯ್ಯುತ್ತದೆ.'],
svc:['ಊರ್ಧ್ವ ಮಹಾಶಿರ (Superior vena cava)','ತಲೆ, ಕುತ್ತಿಗೆ ಮತ್ತು ತೋಳುಗಳಿಂದ ಆಮ್ಲಜನಕ ಕಡಿಮೆ ರಕ್ತವನ್ನು ದಕ್ಷಿಣ ಅಲಿಂದಕ್ಕೆ ತರುತ್ತದೆ.'],
ivc:['ಅಧಃ ಮಹಾಶಿರ (Inferior vena cava)','ದೇಹದ ಕೆಳಭಾಗದಿಂದ ರಕ್ತವನ್ನು ದಕ್ಷಿಣ ಅಲಿಂದಕ್ಕೆ ತರುತ್ತದೆ.'],
pv:['ಫೆಪ್ಪಣ ಶಿರ (Pulmonary vein)','ಶ್ವಾಸಕೋಶದಲ್ಲಿ ಆಮ್ಲಜನಕ ಪಡೆದ ರಕ್ತವನ್ನು ವಾಮ ಅಲಿಂದಕ್ಕೆ ತರುತ್ತದೆ. ಆಮ್ಲಜನಕಯುಕ್ತ ರಕ್ತ ಒಯ್ಯುವ ಏಕೈಕ ಶಿರೆ ಇದು.'],
ra:['ದಕ್ಷಿಣ ಅಲಿಂದ (Right atrium)','ದೇಹದಿಂದ ಬರುವ ಆಮ್ಲಜನಕ ಕಡಿಮೆ ರಕ್ತವನ್ನು ಸ್ವೀಕರಿಸಿ, ತ್ರಿಕವಾಟದ ಮೂಲಕ ದಕ್ಷಿಣ ನಿಲಯಕ್ಕೆ ಕಳುಹಿಸುತ್ತದೆ.'],
la:['ವಾಮ ಅಲಿಂದ (Left atrium)','ಶ್ವಾಸಕೋಶದಿಂದ ಬರುವ ಆಮ್ಲಜನಕಯುಕ್ತ ರಕ್ತವನ್ನು ಸ್ವೀಕರಿಸಿ, ದ್ವಿಕವಾಟದ ಮೂಲಕ ವಾಮ ನಿಲಯಕ್ಕೆ ಕಳುಹಿಸುತ್ತದೆ.'],
rv:['ದಕ್ಷಿಣ ನಿಲಯ (Right ventricle)','ರಕ್ತವನ್ನು ಫೆಪ್ಪಣ ಕವಾಟ ಮತ್ತು ಫೆಪ್ಪಣ ಧಮನಿಯ ಮೂಲಕ ಶ್ವಾಸಕೋಶಕ್ಕೆ ಪಂಪ್ ಮಾಡುತ್ತದೆ. ಗೋಡೆ ತೆಳು.'],
lv:['ವಾಮ ನಿಲಯ (Left ventricle)','ಹೃದಯದ ಅತಿ ಬಲಿಷ್ಠ ಕೋಣೆ. ದಪ್ಪ ಸ್ನಾಯುಗೋಡೆಯಿಂದ ರಕ್ತವನ್ನು ಮಹಾಧಮನಿಗೆ ಬಲವಾಗಿ ಪಂಪ್ ಮಾಡಿ ಇಡೀ ದೇಹಕ್ಕೆ ತಲುಪಿಸುತ್ತದೆ.'],
tri:['ತ್ರಿಕವಾಟ (Tricuspid valve)','ದಕ್ಷಿಣ ಅಲಿಂದ ಮತ್ತು ದಕ್ಷಿಣ ನಿಲಯದ ನಡುವೆ ಇದ್ದು, ರಕ್ತ ಹಿಂದಕ್ಕೆ ಹರಿಯದಂತೆ ತಡೆಯುತ್ತದೆ. ಇದಕ್ಕೆ ಮೂರು ಪರ್ಣಗಳಿವೆ.'],
mit:['ದ್ವಿಕವಾಟ (Bicuspid / Mitral valve)','ವಾಮ ಅಲಿಂದ ಮತ್ತು ವಾಮ ನಿಲಯದ ನಡುವೆ ಇದ್ದು ರಕ್ತ ಒಂದೇ ದಿಕ್ಕಿನಲ್ಲಿ ಹರಿಯುವಂತೆ ಮಾಡುತ್ತದೆ. ಇದಕ್ಕೆ ಎರಡು ಪರ್ಣಗಳಿವೆ.'],
aov:['ಮಹಾಧಮನಿ ಕವಾಟ (Aortic valve)','ವಾಮ ನಿಲಯ ಸಂಕುಚಿತವಾದಾಗ ತೆರೆದು, ವಿಶ್ರಾಂತಿಯಲ್ಲಿ ಮುಚ್ಚಿ ರಕ್ತ ಮರಳದಂತೆ ತಡೆಯುತ್ತದೆ.'],
pulv:['ಫೆಪ್ಪಣ ಕವಾಟ (Pulmonary valve)','ದಕ್ಷಿಣ ನಿಲಯ ಮತ್ತು ಫೆಪ್ಪಣ ಧಮನಿಯ ನಡುವಿನ ಕವಾಟ; ರಕ್ತ ಶ್ವಾಸಕೋಶಕ್ಕೆ ಮಾತ್ರ ಹರಿಯುವಂತೆ ನೋಡಿಕೊಳ್ಳುತ್ತದೆ.']};
const info=$('#info');
function pick(t){const k=t.dataset.k,d=I[k];if(!d)return;document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));document.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.classList.add('on'));info.innerHTML='<h3></h3><p></p>';info.firstChild.textContent=d[0];info.lastChild.textContent=d[1]}
$('#wrap').addEventListener('click',e=>{const t=e.target.closest('.h');if(t)pick(t)});
$('#wrap').addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.classList.contains('h')){e.preventDefault();pick(e.target)}});
requestAnimationFrame(frame);
</script>
