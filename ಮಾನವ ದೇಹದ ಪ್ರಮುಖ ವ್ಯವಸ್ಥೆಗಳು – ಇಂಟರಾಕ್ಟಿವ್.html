<title>ಮಾನವ ದೇಹದ ಪ್ರಮುಖ ವ್ಯವಸ್ಥೆಗಳು – ಇಂಟರಾಕ್ಟಿವ್</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫀</text></svg>">
<style>
:root{--bg:#eef5fb;--panel:#fff;--ink:#1c3b57;--mut:#4a6178;--line:#d5e3ee;--acc:#237a96;--sp:1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c28;--panel:#1a2c3d;--ink:#e6f0f8;--mut:#a5b9ca;--line:#2c4458;--acc:#5cc0dc;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--ink);font-family:"Noto Sans Kannada","Nirmala UI",system-ui,sans-serif}
.ctl{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin:4px 0 10px}
.ctl button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:6px 14px}
.ctl label{display:flex;gap:8px;align-items:center;color:var(--mut)}
button:focus-visible,input:focus-visible,.h:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.wrap{position:relative;max-width:1100px;margin:auto;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.wrap img,.wrap svg{display:block;width:100%;height:auto}
.wrap svg{position:absolute;inset:0}
.h{fill:transparent;stroke:transparent;stroke-width:3;cursor:pointer;transition:fill .15s,stroke .15s}
.h:hover,.h.on{fill:rgba(255,200,40,.22);stroke:#ffb703}
.show .h{stroke:rgba(255,183,3,.7);stroke-dasharray:5 4}
.beat{transform-box:fill-box;transform-origin:center;animation:bt calc(.9s / var(--sp)) ease-in-out infinite}
@keyframes bt{0%,100%{transform:scale(.85);opacity:.15}15%{transform:scale(1.15);opacity:.55}30%{transform:scale(.95);opacity:.25}}
.br{transform-box:fill-box;transform-origin:center;animation:br calc(4s / var(--sp)) ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.94);opacity:.1}50%{transform:scale(1.06);opacity:.4}}
.paused *{animation-play-state:paused !important}
@media(prefers-reduced-motion:reduce){.beat,.br{animation-duration:8s}}
#info{max-width:1100px;margin:12px auto 0;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:12px;padding:12px 18px;min-height:88px}
#info h3{margin:0 0 4px;font-size:1.05rem}
#info p{margin:0;color:var(--mut);line-height:1.7;max-width:80ch}
.leg{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:.85rem;color:var(--mut);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:1px solid #fff}
</style>
</head>
<body>
<div class="ctl">
  <button id="pp" aria-pressed="false">⏸ ನಿಲ್ಲಿಸಿ</button>
  <label>ವೇಗ <input id="sp" type="range" min="0.5" max="3" step="0.1" value="1"> <b id="spv">1×</b></label>
  <label>ಹೃದಯ ಬಡಿತ <b id="bpm">67</b>/ನಿಮಿಷ</label>
  <button id="sh" aria-pressed="false">ಕ್ಲಿಕ್ ಮಾಡಬಹುದಾದ ಭಾಗ ತೋರಿಸಿ</button>
</div>

<div class="leg"><span><i style="background:#5a2a0a"></i>ಆಹಾರ</span><span><i style="background:#1d78c0"></i>O₂ / ಆಮ್ಲಜನಕರಹಿತ ರಕ್ತ</span><span><i style="background:#d6283f"></i>CO₂ / ಆಮ್ಲಜನಕಯುಕ್ತ ರಕ್ತ</span></div>
<div id="info" aria-live="polite"><h3>ಮಾಹಿತಿ</h3><p>ಚಿತ್ರದಲ್ಲಿನ ಯಾವುದೇ ಅಂಗ ಅಥವಾ ಲೇಬಲ್ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ ಅದರ ಕೆಲಸದ ವಿವರ ನೋಡಿ.</p></div>
<script>
const I={
mouth:["ಬಾಯಿ ಮತ್ತು ಹಲ್ಲುಗಳು – ಆಹಾರ ವಿಭಜನೆ","ಹಲ್ಲುಗಳು ಆಹಾರವನ್ನು ಜಗಿದು ಸಣ್ಣ ತುಂಡುಗಳಾಗಿ ಮಾಡುತ್ತವೆ. ಲಾಲಾರಸವು ಪಿಷ್ಟದ ಜೀರ್ಣಕ್ರಿಯೆಯನ್ನು ಬಾಯಿಯಲ್ಲೇ ಆರಂಭಿಸುತ್ತದೆ."],
esoph:["ಅನ್ನನಾಳ (Esophagus)","ಸ್ನಾಯುಗಳ ಅಲೆಯಂತಹ ಸಂಕೋಚನದಿಂದ ಆಹಾರವನ್ನು ಬಾಯಿಯಿಂದ ಹೊಟ್ಟೆಗೆ ತಳ್ಳುತ್ತದೆ."],
stomach:["ಹೊಟ್ಟೆ (Stomach) – ಆಹಾರ ವಿಭಜನೆ","ಆಮ್ಲ ಮತ್ತು ಕಿಣ್ವಗಳಿಂದ ಆಹಾರವನ್ನು ಕಲಸಿ ಮತ್ತಷ್ಟು ವಿಭಜಿಸುತ್ತದೆ."],
small:["ಸಣ್ಣ ಕರುಳು (Small intestine) – ಪೋಷಕಾಂಶ ಹೀರಿಕೆ","ಇಲ್ಲಿ ಪೋಷಕಾಂಶಗಳು ಮತ್ತು ನೀರು ರಕ್ತಕ್ಕೆ ಹೀರಲ್ಪಡುತ್ತವೆ. ಒಳಗೋಡೆಯ ಸಣ್ಣ ಬೆರಳಿನಂತಹ ರಚನೆಗಳು ಹೀರುವ ಮೇಲ್ಮೈಯನ್ನು ಹೆಚ್ಚಿಸುತ್ತವೆ."],
large:["ದೊಡ್ಡ ಕರುಳು – ತ್ಯಾಜ್ಯ ವಿಸರ್ಜನೆ","ಉಳಿದ ನೀರನ್ನು ಹೀರಿಕೊಂಡು, ಜೀರ್ಣವಾಗದ ತ್ಯಾಜ್ಯವನ್ನು ಹೊರಹಾಕಲು ಸಿದ್ಧಪಡಿಸುತ್ತದೆ."],
link1:["ವ್ಯವಸ್ಥೆಗಳ ಸಂಪರ್ಕ: O₂ ಮತ್ತು CO₂ ವಿನಿಮಯ","ಉಸಿರಾಟ ವ್ಯವಸ್ಥೆ ರಕ್ತಕ್ಕೆ ಆಮ್ಲಜನಕ ಕೊಡುತ್ತದೆ; ರಕ್ತ CO₂ ಅನ್ನು ಶ್ವಾಸಕೋಶಕ್ಕೆ ಹಿಂತಿರುಗಿಸುತ್ತದೆ. ಆಹಾರದಿಂದ ಶಕ್ತಿ ಪಡೆಯಲು ಆಮ್ಲಜನಕ ಬೇಕು."],
nose:["ಮೂಗು – CO₂ ಹೊರಹಾಕುವುದು","ಗಾಳಿಯನ್ನು ಒಳಗೆ ತೆಗೆದುಕೊಂಡು ಶೋಧಿಸುತ್ತದೆ. ಉಚ್ಛ್ವಾಸದಲ್ಲಿ ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಹೊರಹೋಗುತ್ತದೆ."],
trachea:["ಶ್ವಾಸನಾಳ (Trachea)","ಕಾರ್ಟಿಲೇಜ್ ಉಂಗುರಗಳಿರುವ ನಳಿಕೆ; ಗಾಳಿಯನ್ನು ಎರಡೂ ಶ್ವಾಸಕೋಶಗಳಿಗೆ ಒಯ್ಯುತ್ತದೆ."],
lung:["ಶ್ವಾಸಕೋಶಗಳು","ಗಾಳಿಚೀಲಗಳಲ್ಲಿ (ಆಲ್ವಿಯೋಲೈ) ಆಮ್ಲಜನಕ ರಕ್ತಕ್ಕೆ ಸೇರುತ್ತದೆ. ಹೊಳೆಯುವ ನೀಲಿ ಪದರ ಉಸಿರಾಟದಂತೆ ಹಿಗ್ಗಿ ಕುಗ್ಗುತ್ತದೆ."],
o2:["O₂ ವಿನಿಮಯ","ನೀಲಿ ಚುಕ್ಕೆಗಳು ಆಮ್ಲಜನಕ ಒಳಗೆ ಹೋಗುವುದನ್ನು, ಕೆಂಪು ಚುಕ್ಕೆ CO₂ ಹೊರಬರುವುದನ್ನು ತೋರಿಸುತ್ತವೆ."],
alv:["ರಕ್ತಕ್ಕೆ ಆಮ್ಲಜನಕ ತಲುಪಿಸುವುದು","ಆಲ್ವಿಯೋಲೈ ಸುತ್ತಲಿನ ಸೂಕ್ಷ್ಮ ರಕ್ತನಾಳಗಳಲ್ಲಿ ಕೆಂಪು ರಕ್ತ ಕಣಗಳು ಆಮ್ಲಜನಕವನ್ನು ಹಿಡಿದುಕೊಳ್ಳುತ್ತವೆ."],
link2:["ವ್ಯವಸ್ಥೆಗಳ ಸಂಪರ್ಕ: ಪೋಷಕಾಂಶ ಸಾಗಣೆ","ಜೀರ್ಣಾಂಗದಲ್ಲಿ ಹೀರಲ್ಪಟ್ಟ ಪೋಷಕಾಂಶಗಳನ್ನು ರಕ್ತಪರಿಚಲನೆ ಎಲ್ಲ ಅಂಗಗಳಿಗೆ ಒಯ್ಯುತ್ತದೆ."],
heart:["ಹೃದಯ – ರಕ್ತ ಪಂಪ್ ಮಾಡುವುದು","ಸತತವಾಗಿ ಬಡಿದು ರಕ್ತವನ್ನು ಇಡೀ ದೇಹಕ್ಕೆ ಮತ್ತು ಶ್ವಾಸಕೋಶಕ್ಕೆ ಪಂಪ್ ಮಾಡುತ್ತದೆ. ಸ್ಲೈಡರ್ ವೇಗ ಹೆಚ್ಚಿಸಿದರೆ ಬಡಿತ ಹೆಚ್ಚುತ್ತದೆ."],
brain:["ಮೆದುಳು","ಹೆಚ್ಚು ಆಮ್ಲಜನಕ ಬಳಸುವ ಅಂಗ. ಅಪಧಮನಿಗಳು ತಾಜಾ ರಕ್ತ ತಲುಪಿಸುತ್ತವೆ."],
o2c:["ಆಮ್ಲಜನಕ ಸಾಗಣೆ","ಕೆಂಪು ರಕ್ತ ಕಣಗಳು ಶ್ವಾಸಕೋಶದಿಂದ ಆಮ್ಲಜನಕ ಪಡೆದು ಅಪಧಮನಿಗಳ ಮೂಲಕ ಅಂಗಗಳಿಗೆ ಒಯ್ಯುತ್ತವೆ; ಸಿರೆಗಳು (ನೀಲಿ) ಹಿಂತಿರುಗಿಸುತ್ತವೆ."],
liver:["ಯಕೃತ್ತು (Liver)","ಕರುಳಿನಿಂದ ಬಂದ ಪೋಷಕಾಂಶಗಳನ್ನು ಸಂಸ್ಕರಿಸಿ ಸಂಗ್ರಹಿಸುತ್ತದೆ, ರಕ್ತವನ್ನು ಶುದ್ಧಗೊಳಿಸುತ್ತದೆ."],
kidney:["ಮೂತ್ರಪಿಂಡಗಳು","ರಕ್ತದಿಂದ ತ್ಯಾಜ್ಯ ಮತ್ತು ಹೆಚ್ಚುವರಿ ನೀರನ್ನು ಶೋಧಿಸಿ ಮೂತ್ರ ತಯಾರಿಸುತ್ತವೆ."],
gut:["ಪೋಷಕಾಂಶ ತಲುಪಿಸುವುದು","ಕರುಳಿನ ಸುತ್ತಲಿನ ರಕ್ತನಾಳ ಜಾಲ ಪೋಷಕಾಂಶಗಳನ್ನು ಪಡೆದು ಎಲ್ಲ ಕೋಶಗಳಿಗೆ ತಲುಪಿಸುತ್ತದೆ."]};
const info=document.getElementById('info'),wrap=document.getElementById('wrap');
function pick(t){const k=t.dataset.k,d=I[k];if(!d)return;
 document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
 document.querySelectorAll('[data-k="'+k+'"]').forEach(x=>x.classList.add('on'));
 info.innerHTML='<h3></h3><p></p>';info.firstChild.textContent=d[0];info.lastChild.textContent=d[1];
 const x=+(t.getAttribute('cx')||t.getAttribute('x')||0);
 info.style.borderLeftColor=x<340?'#d9822b':x<690?'#237a96':'#a3223f'}
wrap.addEventListener('click',e=>{const t=e.target.closest('.h');if(t)pick(t)});
wrap.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('h')){e.preventDefault();pick(e.target)}});
const svg=wrap.querySelector('svg'),pp=document.getElementById('pp'),sp=document.getElementById('sp'),sh=document.getElementById('sh');
pp.onclick=()=>{const p=!document.body.classList.contains('paused');document.body.classList.toggle('paused',p);
 p?svg.pauseAnimations():svg.unpauseAnimations();pp.textContent=p?'▶ ಮುಂದುವರಿಸಿ':'⏸ ನಿಲ್ಲಿಸಿ';pp.setAttribute('aria-pressed',p)};
sh.onclick=()=>{const s=wrap.classList.toggle('show');sh.setAttribute('aria-pressed',s)};
sp.oninput=()=>{const v=+sp.value;document.documentElement.style.setProperty('--sp',v);
 document.getElementById('spv').textContent=v.toFixed(1)+'×';
 document.getElementById('bpm').textContent=Math.round(67*v);
 svg.querySelectorAll('animateMotion').forEach(a=>a.setAttribute('dur',(a.dataset.d/v)+'s'))};
</script>
